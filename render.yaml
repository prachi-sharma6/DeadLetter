# Render Blueprint: one free web service running API + web app + in-process worker (docs/deploy/render.md).
# Secrets use `sync: false`: Render asks for their values when the Blueprint is first created; they never live in git.
services:
  - type: web
    name: deadletter
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health/live
    autoDeployTrigger: checksPass # deploy only after GitHub CI passes on main
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: TRUST_PROXY
        value: '1'
      - key: DATABASE_POOL_MAX
        value: '3'
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: APP_ORIGIN
        sync: false
      - key: DATABASE_CA_CERT # Supabase CA certificate (public); enables verified TLS
        sync: false
