name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dl_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.2
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      LOG_LEVEL: silent
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dl_test
      REDIS_URL: redis://localhost:6379/1
      APP_ORIGIN: http://localhost:5173
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (with coverage)
        run: npm run test:coverage
      - name: Integration tests (Postgres + Redis)
        run: npm run test:integration
      - name: Build
        run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - name: Build api image
        run: docker build --target api --build-arg GIT_SHA=${{ github.sha }} -t deadletter-api:ci .
      - name: Build worker image
        run: docker build --target worker --build-arg GIT_SHA=${{ github.sha }} -t deadletter-worker:ci .
      - name: Smoke-test api image (liveness without dependencies)
        run: |
          docker run -d --name api -p 8080:8080 \
            -e DATABASE_URL=postgresql://u:p@127.0.0.1:1/db -e REDIS_URL=redis://127.0.0.1:1 \
            -e APP_ORIGIN=http://localhost:8080 deadletter-api:ci
          for i in $(seq 1 30); do curl -fsS localhost:8080/api/health/live && break; sleep 1; done
          curl -fsS localhost:8080/api/health/live
          curl -fsS -o /dev/null localhost:8080/
          docker logs api

  audit:
    name: Dependency audit (production deps)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run audit:prod
